<!-- @dsCard group="Papelería" height=420 subtitle="Hoja carta · cotizaciones, facturas y cartas" -->
<!doctype html>
<html><head><meta charset="utf-8"><title>Membrete</title>
<style>
  .hoja{margin:var(--space-6);background:#fff;color:var(--marca-negro-crudo);box-shadow:var(--shadow-1);max-width:720px;position:relative}
  .cab{display:flex;align-items:center;gap:var(--space-4);padding:28px 40px 20px}
  .cab img{width:76px;height:76px}
  .cab h1{font:600 26px/28px var(--font-display);margin:0;letter-spacing:.01em}
  .cab .sub{font:600 10px/14px var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--marca-azul-petroleo);margin-top:4px}
  .cab .doc{margin-left:auto;text-align:right}
  .cab .doc b{display:block;font:600 11px/14px var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:#4f5660}
  .cab .doc span{font:500 18px/24px var(--font-mono)}
  .filete{height:3px;background:var(--marca-azul-petroleo);margin:0 40px;position:relative}
  .filete::after{content:"";position:absolute;left:0;top:3px;width:120px;height:3px;background:var(--marca-ambar)}
  table{width:calc(100% - 80px);margin:24px 40px;border-collapse:collapse;font:400 12px/18px var(--font-sans)}
  th{background:var(--marca-azul-petroleo);color:var(--marca-hueso);text-align:left;font:600 10px/14px var(--font-sans);letter-spacing:.12em;text-transform:uppercase;padding:8px 10px}
  td{padding:8px 10px;border-bottom:1px solid #d6d0c3}
  td.n{font-family:var(--font-mono);text-align:right}
  .pie{border-top:1px solid #d6d0c3;margin:0 40px;padding:12px 0 20px;display:flex;justify-content:space-between;font:400 10px/14px var(--font-sans);color:#4f5660}
  .pie .m{font-family:var(--font-mono)}
</style></head>
<body>
<div class="hoja">
  <div class="cab">
    <img src="/_blob/73d364c6246b53592b15c999342247bb" alt="Logo V&G">
    <div><h1>V&amp;G Proyectos y Servicios, C.A.</h1><div class="sub">Servicios · Planificación de proyectos · Sector petrolero</div></div>
    <div class="doc"><b>Cotización</b><span>N.º 0001</span></div>
  </div>
  <div class="filete"></div>
  <table>
    <tr><th>Descripción</th><th>Unidad</th><th style="text-align:right">Cant.</th><th style="text-align:right">Total</th></tr>
    <tr><td>Planificación y gestión del proyecto</td><td>Global</td><td class="n">0</td><td class="n">0,00</td></tr>
    <tr><td>Servicios técnicos en campo</td><td>Días</td><td class="n">0</td><td class="n">0,00</td></tr>
  </table>
  <div class="pie"><span class="m">RIF J-50477953-9</span><span>Dirección fiscal · Teléfono · Correo</span></div>
</div>
<script></script>
</body></html>
